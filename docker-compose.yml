version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: n4m_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: u432003722_portaln4m
      MYSQL_USER: u432003722_maurilioayrton
      MYSQL_PASSWORD: 23311913mmmN.
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n4m_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n4m_app
    restart: always
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_DB_HOST=mysql
      - VITE_DB_PORT=3306
      - VITE_DB_NAME=u432003722_portaln4m
      - VITE_DB_USER=u432003722_maurilioayrton
      - VITE_DB_PASSWORD=23311913mmmN.
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - n4m_network
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql_data:
    driver: local

networks:
  n4m_network:
    driver: bridge
